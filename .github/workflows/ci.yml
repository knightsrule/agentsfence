name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest
      - run: agentsfence --help

  # os.kill(pid, 0) terminates a process on Windows, so runtime cleanup must
  # never signal to check liveness. Only a Windows runner can prove that.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/test_runtime_cleanup.py

  # The suite above has no Hermes, so its real-Hermes tests skip. Run them
  # against pinned main and RC revisions with the required PM and approval APIs.
  hermes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A `main` revision is listed here only once AgentsFence claims compatibility
        # with it; its enforcement checks then gate a release like the tags do.
        include:
          - hermes: "main 801a9022a742"
            ref: 801a9022a742562a3c4578c0d8dd12cfd393fc47
            python: "3.14"
          - hermes: "rc.14-v0.21.5"
            ref: 64f2be353fd8bcf6badbe22f6da8b83398b25665
            python: "3.14"
    name: hermes ${{ matrix.hermes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.ref }}
          path: hermes-agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Install Hermes and AgentsFence runtime dependencies
        run: |
          uv venv hermes-agent/venv --python ${{ matrix.python }}
          uv pip install --python hermes-agent/venv/bin/python -e ./hermes-agent "pydantic>=2.6,<3" "PyYAML>=6.0" "python-dotenv>=1.0" "fastapi>=0.115"
      - run: python -m pip install -e ".[dev]"
      - name: Real-Hermes integration tests
        env:
          AGENTSFENCE_HERMES_PYTHON: ${{ github.workspace }}/hermes-agent/venv/bin/python
        run: pytest tests/test_hermes_integration.py

  # Early warning only: the tip of Hermes `main` (what `hermes update` installs)
  # changes daily. Not required for release; failures signal work before the
  # pinned `main` revision above is advanced.
  hermes-main-tip:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: main
          path: hermes-agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Install Hermes main and AgentsFence runtime dependencies
        run: |
          uv venv hermes-agent/venv --python 3.14
          uv pip install --python hermes-agent/venv/bin/python -e ./hermes-agent "pydantic>=2.6,<3" "PyYAML>=6.0" "python-dotenv>=1.0" "fastapi>=0.115"
      - run: python -m pip install -e ".[dev]"
      - name: Real-Hermes integration tests
        env:
          AGENTSFENCE_HERMES_PYTHON: ${{ github.workspace }}/hermes-agent/venv/bin/python
        run: |
          git -C hermes-agent rev-parse HEAD 2>/dev/null || true
          pytest tests/test_hermes_integration.py

  release:
    name: Release an unpublished version after CI
    needs: [test, windows, hermes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: automatic-release
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Skip a superseded main commit
        id: current
        run: |
          git fetch origin main --tags
          if [ "$GITHUB_SHA" = "$(git rev-parse origin/main)" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.current.outputs.release == 'true'
        with:
          python-version: '3.11'
      - name: Install release metadata tooling
        if: steps.current.outputs.release == 'true'
        run: python -m pip install packaging
      - name: Check versions, PyPI and existing tag
        if: steps.current.outputs.release == 'true'
        id: plan
        run: python .github/scripts/prepare_release.py
      - name: Create the release tag
        if: steps.plan.outputs.create_tag == 'true'
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "AgentsFence $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
      # Tags created with GITHUB_TOKEN do not trigger push workflows. Dispatch
      # explicitly, using the same token: no PAT or cross-repo trigger is needed.
      - name: Start PyPI publication from the tag
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: gh workflow run publish-pypi.yml --ref "$RELEASE_TAG"

name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require a release tag (including manual runs)
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo 'Publication must run from a v* tag'; exit 1 ;;
          esac
      - name: Verify release commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install release tools and test dependencies
        run: python -m pip install '.[dev]' build twine packaging
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from packaging.version import Version

          tag = os.environ['RELEASE_TAG']
          if not tag.startswith('v'):
              raise SystemExit(f'Expected a version tag starting with v: {tag}')
          with open('pyproject.toml', 'rb') as source:
              version = tomllib.load(source)['project']['version']
          if Version(tag[1:]) != Version(version):
              raise SystemExit(f'Tag {tag} does not match package version {version}')
          print(f'Publishing agentsfence {version} from {tag}')
          PY
      # Same gate as the automatic release (ci.yml): a beta, rc or final version needs its
      # recorded beta-gate evidence, including when a tag is pushed or dispatched by hand.
      - name: Require the recorded beta gate
        run: python .github/scripts/prepare_release.py --check-evidence
      - run: ruff check .
      - run: mypy
      - run: pytest
      - run: agentsfence --help
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/agentsfence/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
